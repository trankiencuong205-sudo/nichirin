name: Build mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen project
        run: unzip -q -o ./nichirin-mod*.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build
        working-directory: nichirin-mod
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nichirin-jar
          path: nichirin-mod/build/libs/nichirin-blades-1.0.0.jar
